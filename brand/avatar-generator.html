<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#07080b}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Аватарка Torf1n: буква T в стиле сайта + цветочная лента
const seedRand = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
const rnd = seedRand;
const S = 128, R = 54;
function petalPath(g, kind, r) {
  g.beginPath(); g.moveTo(0, 0);
  if (kind === "sakura") {
    g.bezierCurveTo(-r*.5,-r*.28,-r*.46,-r*.86,-r*.17,-r*.99);
    g.quadraticCurveTo(-r*.06,-r*.9,0,-r*.84); g.quadraticCurveTo(r*.06,-r*.9,r*.17,-r*.99);
    g.bezierCurveTo(r*.46,-r*.86,r*.5,-r*.28,0,0);
  } else if (kind === "thin") {
    g.bezierCurveTo(-r*.3,-r*.3,-r*.2,-r*.92,0,-r); g.bezierCurveTo(r*.2,-r*.92,r*.3,-r*.3,0,0);
  } else {
    g.bezierCurveTo(-r*.56,-r*.34,-r*.42,-r,0,-r); g.bezierCurveTo(r*.42,-r,r*.56,-r*.34,0,0);
  }
  g.closePath();
}
function flower(tint, kind, n) {
  const c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"); g.translate(S/2, S/2);
  const r = kind === "thin" ? R*.92 : R;
  for (let i = 0; i < n; i++) {
    g.save(); g.rotate(i*Math.PI*2/n + (rnd()-.5)*.12); const sc = .92 + rnd()*.14; g.scale(sc, sc);
    g.shadowColor = "rgba(20,10,30,.35)"; g.shadowBlur = 6; g.shadowOffsetY = 1;
    const gr = g.createLinearGradient(0,0,0,-r);
    gr.addColorStop(0,"#d9cbd6"); gr.addColorStop(.28,tint); gr.addColorStop(.85,tint); gr.addColorStop(1,"#fff");
    g.fillStyle = gr; petalPath(g, kind, r); g.fill(); g.shadowColor = "transparent";
    const e = g.createRadialGradient(0,-r*.5,r*.15,0,-r*.5,r*.62);
    e.addColorStop(0,"rgba(255,255,255,0)"); e.addColorStop(1,"rgba(150,135,170,.16)");
    g.fillStyle = e; petalPath(g, kind, r); g.fill();
    g.strokeStyle = "rgba(140,120,160,.16)"; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(0,-r*.12); g.quadraticCurveTo(r*.03,-r*.45,0,-r*.72); g.stroke();
    g.restore();
  }
  const cg = g.createRadialGradient(0,0,0,0,0,R*.2);
  cg.addColorStop(0,"#fff4b8"); cg.addColorStop(.6,"#f2c44e"); cg.addColorStop(1,"rgba(214,150,40,0)");
  g.fillStyle = cg; g.beginPath(); g.arc(0,0,R*.2,0,7); g.fill();
  for (let i = 0; i < 9; i++) { const a = i/9*Math.PI*2, d = R*(.15+rnd()*.1);
    g.fillStyle = "#c9862a"; g.beginPath(); g.arc(Math.cos(a)*d, Math.sin(a)*d, 1.5, 0, 7); g.fill(); }
  return c;
}
function leaf(h) {
  const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); g.translate(32,32);
  const gr = g.createLinearGradient(-8,0,8,0); gr.addColorStop(0,`hsl(${h},45%,14%)`); gr.addColorStop(1,`hsl(${h},40%,26%)`);
  g.fillStyle = gr; g.beginPath(); g.moveTo(0,-28); g.quadraticCurveTo(13,-6,0,28); g.quadraticCurveTo(-13,-6,0,-28); g.fill(); return c;
}
const tints = ["#ffffff","#ffffff","#fffdf8","#fff3f8","#f3f0ff","#eef9ff","#ecfbf5","#fff0f4"];
const kinds = [["sakura",5],["sakura",5],["round",5],["round",6],["thin",8]];
const sprites = []; tints.forEach(t => kinds.forEach(([k,n]) => sprites.push(flower(t,k,n))));
function soft(src) { const c = document.createElement("canvas"); c.width = c.height = S; const g = c.getContext("2d"); g.filter = "blur(5px)"; g.drawImage(src,0,0); return c; }
const leaves = [150,160,170].map(leaf);
const gauss = () => (rnd()+rnd()+rnd()-1.5)/1.5;

document.fonts.load("900 100px Unbounded").then(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d"), W = 1080, H = 1080;
  // фон
  ctx.fillStyle = "#07080b"; ctx.fillRect(0,0,W,H);
  const glow = ctx.createRadialGradient(W/2,H*.46,0,W/2,H*.46,W*.55);
  glow.addColorStop(0,"rgba(120,100,255,.20)"); glow.addColorStop(.5,"rgba(90,70,200,.07)"); glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

  // цветы: лента снизу-слева вверх-вправо
  const parts = [];
  for (let i = 0; i < 950; i++) {
    const z = Math.pow(rnd(), 1.5), u = rnd()*1.3 - .15, isLeaf = rnd() < .1;
    const x = u*W, y = H*(.80 - .52*u) + gauss()*(30 + z*170) + z*z*90;
    const sp = isLeaf ? leaves[(rnd()*3)|0] : sprites[(rnd()*sprites.length)|0];
    parts.push({ x, y, z, isLeaf, sp, size: (isLeaf?10:6) + z*z*64 + rnd()*4, rot: rnd()*6.28, blur: z > .93 && rnd() < .5 });
  }
  parts.sort((a,b) => a.z - b.z);
  const draw = p => {
    ctx.save(); ctx.globalAlpha = p.isLeaf ? .7 : .3 + p.z*.7; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    const img = p.blur ? soft(p.sp) : p.sp; ctx.drawImage(img, -p.size/2, -p.size/2, p.size, p.size); ctx.restore();
  };
  parts.filter(p => p.z < .72).forEach(draw);          // задний план

  // буква T
  const lc = document.createElement("canvas"); lc.width = W; lc.height = H; const lg = lc.getContext("2d");
  lg.font = "900 700px Unbounded"; lg.textAlign = "center";
  const m = lg.measureText("T"), ty = H/2 + m.actualBoundingBoxAscent/2 - 10;
  const tg = lg.createLinearGradient(0, ty - m.actualBoundingBoxAscent, 0, ty);
  tg.addColorStop(0,"#ffffff"); tg.addColorStop(.45,"#ebe9f0"); tg.addColorStop(1,"#9d9ba7");
  lg.fillStyle = tg; lg.fillText("T", W/2, ty);
  lg.globalCompositeOperation = "source-atop";               // блик только по букве
  const sh = lg.createLinearGradient(W*.3,H*.2,W*.7,H*.8);
  sh.addColorStop(.38,"rgba(255,255,255,0)"); sh.addColorStop(.5,"rgba(255,255,255,.6)"); sh.addColorStop(.6,"rgba(255,255,255,0)");
  lg.fillStyle = sh; lg.fillRect(0,0,W,H);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
  ctx.drawImage(lc, 0, 0); ctx.restore();

  parts.filter(p => p.z >= .72).forEach(draw);         // передний план поверх буквы

  // лёгкая виньетка
  const v = ctx.createRadialGradient(W/2,H/2,W*.36,W/2,H/2,W*.75);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
  document.title = "done";
});
</script></body></html>
